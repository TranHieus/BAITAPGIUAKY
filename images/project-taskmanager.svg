<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGrad2)"/>

  <!-- Glowing Aura -->
  <circle cx="300" cy="180" r="140" fill="#22d3ee" opacity="0.15" filter="url(#glow2)"/>
  <circle cx="580" cy="320" r="130" fill="#6366f1" opacity="0.2" filter="url(#glow2)"/>

  <!-- Browser Container -->
  <rect x="70" y="50" width="660" height="400" rx="16" fill="#1e293b" fill-opacity="0.7" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>

  <!-- Window controls -->
  <circle cx="100" cy="75" r="6" fill="#ef4444"/>
  <circle cx="120" cy="75" r="6" fill="#f59e0b"/>
  <circle cx="140" cy="75" r="6" fill="#10b981"/>

  <!-- Title Mockup -->
  <rect x="180" y="68" width="120" height="14" rx="4" fill="#94a3b8" opacity="0.5"/>

  <!-- Kanban Columns -->
  <!-- Column 1: To Do -->
  <g transform="translate(100, 110)">
    <rect x="0" y="0" width="180" height="310" rx="10" fill="#0f172a" stroke="rgba(255,255,255,0.06)"/>
    <circle cx="20" cy="25" r="5" fill="#f59e0b"/>
    <rect x="35" y="19" width="70" height="12" rx="3" fill="#cbd5e1"/>
    
    <!-- Task card 1 -->
    <rect x="12" y="50" width="156" height="75" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.08)"/>
    <rect x="24" y="65" width="100" height="10" rx="2" fill="#e2e8f0"/>
    <rect x="24" y="85" width="60" height="8" rx="2" fill="#64748b"/>
    <rect x="24" y="103" width="35" height="12" rx="4" fill="#ef4444" opacity="0.7"/>

    <!-- Task card 2 -->
    <rect x="12" y="140" width="156" height="75" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.08)"/>
    <rect x="24" y="155" width="115" height="10" rx="2" fill="#e2e8f0"/>
    <rect x="24" y="175" width="70" height="8" rx="2" fill="#64748b"/>
    <rect x="24" y="193" width="45" height="12" rx="4" fill="#3b82f6" opacity="0.7"/>
  </g>

  <!-- Column 2: In Progress -->
  <g transform="translate(310, 110)">
    <rect x="0" y="0" width="180" height="310" rx="10" fill="#0f172a" stroke="rgba(255,255,255,0.06)"/>
    <circle cx="20" cy="25" r="5" fill="#06b6d4"/>
    <rect x="35" y="19" width="85" height="12" rx="3" fill="#cbd5e1"/>

    <!-- Task card active -->
    <rect x="12" y="50" width="156" height="85" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
    <rect x="24" y="65" width="120" height="10" rx="2" fill="#e2e8f0"/>
    <rect x="24" y="85" width="80" height="8" rx="2" fill="#64748b"/>
    <rect x="24" y="105" width="55" height="14" rx="4" fill="#06b6d4" opacity="0.8"/>
  </g>

  <!-- Column 3: Done -->
  <g transform="translate(520, 110)">
    <rect x="0" y="0" width="180" height="310" rx="10" fill="#0f172a" stroke="rgba(255,255,255,0.06)"/>
    <circle cx="20" cy="25" r="5" fill="#10b981"/>
    <rect x="35" y="19" width="60" height="12" rx="3" fill="#cbd5e1"/>

    <!-- Task card completed -->
    <rect x="12" y="50" width="156" height="75" rx="8" fill="#1e293b" opacity="0.7"/>
    <rect x="24" y="65" width="90" height="10" rx="2" fill="#94a3b8"/>
    <rect x="24" y="85" width="50" height="8" rx="2" fill="#475569"/>
    <rect x="24" y="103" width="40" height="12" rx="4" fill="#10b981" opacity="0.7"/>
  </g>
</svg>
