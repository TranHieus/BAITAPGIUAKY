<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGrad3)"/>

  <!-- Glowing Orbs -->
  <circle cx="250" cy="160" r="130" fill="#8b5cf6" opacity="0.2" filter="url(#glow3)"/>
  <circle cx="600" cy="360" r="140" fill="#38bdf8" opacity="0.15" filter="url(#glow3)"/>

  <!-- Browser Window -->
  <rect x="70" y="50" width="660" height="400" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>

  <!-- Window Dots -->
  <circle cx="100" cy="75" r="6" fill="#ef4444"/>
  <circle cx="120" cy="75" r="6" fill="#f59e0b"/>
  <circle cx="140" cy="75" r="6" fill="#10b981"/>

  <!-- Layout: Sidebar + Article -->
  <!-- Left Sidebar -->
  <g transform="translate(100, 110)">
    <rect x="0" y="0" width="160" height="310" rx="8" fill="#0f172a" stroke="rgba(255,255,255,0.06)"/>
    <rect x="15" y="20" width="90" height="12" rx="3" fill="#cbd5e1"/>
    <rect x="15" y="50" width="130" height="8" rx="2" fill="#64748b"/>
    <rect x="15" y="70" width="110" height="8" rx="2" fill="#64748b"/>
    <rect x="15" y="90" width="120" height="8" rx="2" fill="#64748b"/>
    <rect x="15" y="110" width="95" height="8" rx="2" fill="#64748b"/>
  </g>

  <!-- Main Article -->
  <g transform="translate(280, 110)">
    <rect x="0" y="0" width="420" height="310" rx="8" fill="#0f172a" stroke="rgba(255,255,255,0.06)"/>
    <!-- Article Header -->
    <rect x="25" y="25" width="280" height="18" rx="4" fill="url(#textGrad)"/>
    <rect x="25" y="52" width="140" height="10" rx="2" fill="#64748b"/>
    
    <!-- Code block mockup -->
    <rect x="25" y="80" width="370" height="95" rx="8" fill="#020617" stroke="rgba(99,102,241,0.3)"/>
    <rect x="40" y="95" width="100" height="8" rx="2" fill="#38bdf8"/>
    <rect x="40" y="112" width="180" height="8" rx="2" fill="#34d399"/>
    <rect x="55" y="129" width="140" height="8" rx="2" fill="#fbbf24"/>
    <rect x="40" y="146" width="60" height="8" rx="2" fill="#f43f5e"/>

    <!-- Article Paragraphs -->
    <rect x="25" y="195" width="370" height="8" rx="2" fill="#cbd5e1" opacity="0.6"/>
    <rect x="25" y="215" width="350" height="8" rx="2" fill="#cbd5e1" opacity="0.6"/>
    <rect x="25" y="235" width="290" height="8" rx="2" fill="#cbd5e1" opacity="0.6"/>
  </g>
</svg>
